name: Docker Build

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      audit:
        description: Audit this PR candidate; non-PR runs always audit.
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      IMAGE_NAME: vihangapankaja/zip-image-viewer
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Retain attestations in the local image store
        uses: docker/setup-docker-action@v5.6.0
        with:
          set-host: true
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.38.1
          driver: docker

      - name: Read app version
        id: app-version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.app-version.outputs.version }}

      - name: Build the local candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The Docker driver loads into the containerd store, preserving attestations.
          provenance: mode=max
          sbom: ${{ inputs.audit || github.event_name != 'pull_request' }}

      - name: Extract the candidate's BuildKit SBOM
        if: inputs.audit || github.event_name != 'pull_request'
        shell: bash
        env:
          BUILD_REF: ${{ fromJSON(steps.build.outputs.metadata)['buildx.build.ref'] }}
        run: |
          [[ "$BUILD_REF" =~ ^([^/]+)/([^/]+)/([^/]+)$ ]]
          builder="${BASH_REMATCH[1]}"
          record="${BASH_REMATCH[3]}"
          # Buildx's SBOM shortcut does not traverse exported attestation manifests.
          attestation=$(docker buildx --builder "$builder" history inspect attachment --type index "$record" |
            jq -er '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest] |
              select(length == 1) | .[0]')
          sbom=$(docker buildx --builder "$builder" history inspect attachment "$record" "$attestation" |
            jq -er '[.layers[] | select(.annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document") | .digest] |
              select(length == 1) | .[0]')
          docker buildx --builder "$builder" history inspect attachment "$record" "$sbom" |
            jq -e 'select(.predicateType == "https://spdx.dev/Document") | .predicate |
              select(.spdxVersion | startswith("SPDX-")) |
              select((.packages | type) == "array" and (.packages | length) > 0)' \
              > "$RUNNER_TEMP/image-sbom.spdx.json"

      - name: Report production image vulnerabilities for triage
        if: inputs.audit || github.event_name != 'pull_request'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ runner.temp }}/image-sbom.spdx.json
          output-format: json
          output-file: ${{ runner.temp }}/image-vulnerabilities.json
          # Findings need exposure/fix review; scanner failures still fail the job.
          fail-build: false

      - name: Retain image inventory and vulnerability evidence
        if: always() && (inputs.audit || github.event_name != 'pull_request')
        uses: actions/upload-artifact@v7
        with:
          name: image-dependency-reports
          path: |
            ${{ runner.temp }}/image-sbom.spdx.json
            ${{ runner.temp }}/image-vulnerabilities.json
          retention-days: 30
          if-no-files-found: error

      - name: Smoke-test Docker image
        run: |
          volume_name="retention-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          docker volume create "$volume_name"
          container_id=$(docker run --detach \
            --mount type=volume,source="$volume_name",target=/app/sessions \
            --mount type=bind,source="$PWD/tests/integration/containerRetentionSmoke.mjs",target=/app/tests/integration/containerRetentionSmoke.mjs,readonly \
            ${{ env.IMAGE_NAME }}:latest)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"; docker volume rm "$volume_name"' EXIT
          wait_ready() {
            for _ in {1..60}; do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
              if [ "$status" = healthy ] && docker exec "$container_id" node -e "fetch('http://127.0.0.1:8080/health').then(async r=>{if(!(await r.json()).ready)process.exit(1)}).catch(()=>process.exit(1))"; then
                docker logs "$container_id" 2>&1 | grep --fixed-strings "[INFO] server.started"
                return 0
              fi
              if [ "$status" = unhealthy ]; then return 1; fi
              sleep 1
            done
            return 1
          }
          wait_ready
          docker exec "$container_id" node tests/integration/containerRetentionSmoke.mjs seed
          docker restart "$container_id"
          wait_ready
          docker exec "$container_id" node tests/integration/containerRetentionSmoke.mjs verify

      - name: Decode HLS in production image
        run: |
          docker run --rm --entrypoint node \
            --mount type=bind,source="$PWD/tests/integration/containerHlsSmoke.mjs",target=/app/tests/integration/containerHlsSmoke.mjs,readonly \
            ${{ env.IMAGE_NAME }}:latest /app/tests/integration/containerHlsSmoke.mjs

      - name: Set up Vite+ for browser smoke checks
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium

      - name: Play HLS through the production image in Chromium
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:8080:8080 \
            --entrypoint node \
            --mount type=bind,source="$PWD/tests/integration/containerBrowserFixture.mjs",target=/app/tests/integration/containerBrowserFixture.mjs,readonly \
            ${{ env.IMAGE_NAME }}:latest /app/tests/integration/containerBrowserFixture.mjs)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for _ in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          node tests/integration/containerBrowserSmoke.mjs

      - name: Retain media verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-media
          path: |
            test-results/container-playback.png
          retention-days: 14
          if-no-files-found: warn

      - name: Log in to Docker Hub after verification
        if: inputs.publish && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the verified candidate without rebuilding
        if: inputs.publish && github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          docker push "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:latest"
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" --format '{{json .Provenance}}' | jq -e 'length > 0'
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" --format '{{json .SBOM}}' | jq -e 'length > 0'
