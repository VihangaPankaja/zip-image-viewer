name: Docker Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: vihangapankaja/zip-image-viewer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read app version
        id: app-version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.app-version.outputs.version }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Docker image
        if: github.event_name == 'pull_request'
        run: |
          container_id=$(docker run --detach ${{ env.IMAGE_NAME }}:latest)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [ "$status" = healthy ]; then
              docker logs "$container_id" 2>&1 | grep --fixed-strings "[INFO] server.started"
              exit 0
            fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 1
          done
          exit 1
