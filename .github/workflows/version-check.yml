name: Version Validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Retain the required check name while allowing unchanged versions.
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite+ and the project Node.js version
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: false
          node-version-file: .node-version

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Validate optional app version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { validateAppVersion } from './tooling/release-version.mjs';
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const basePackageJson = JSON.parse(
            execFileSync('git', ['show', `origin/${process.env.BASE_REF}:package.json`], { encoding: 'utf8' })
          );
          validateAppVersion(packageJson.version, validateAppVersion(basePackageJson.version));
          console.log(`App version validation passed: ${basePackageJson.version} -> ${packageJson.version}`);
          EOF
