name: Quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Verification plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
      tree: ${{ steps.plan.outputs.tree }}
      audit: ${{ steps.plan.outputs.audit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find successful PR verification for this squash merge
        id: plan
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { readFileSync } = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { findVerifiedPullRequest, imageAuditNeeded } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/tooling/ci-verification.mjs`).href);
            const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
            const run = await findVerifiedPullRequest({ github, context, core, tree });
            let audit = true;
            if (context.eventName === 'pull_request') {
              try {
                const base = context.payload.pull_request.base.sha;
                const files = execFileSync('git', ['diff', '--name-only', '-z', '--no-renames', base, 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean);
                const before = JSON.parse(execFileSync('git', ['show', `${base}:package.json`], { encoding: 'utf8' }));
                audit = imageAuditNeeded(files, before, JSON.parse(readFileSync('package.json', 'utf8')));
              } catch (error) {
                core.warning(`Cannot determine image audit scope; keeping audit enabled: ${error.message}`);
              }
            }
            core.setOutput('tree', tree);
            core.setOutput('reuse', Boolean(run));
            core.setOutput('audit', audit);
            await core.summary.addRaw(run
              ? `Reusing successful PR verification: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}\n`
              : 'No matching successful PR verification; running full CI.\n')
              .addRaw(audit ? 'Image audit enabled.\n' : 'Image audit skipped: no dependency or container input changes.\n').write();

  checks:
    name: Static checks and coverage
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vp exec vp toolchain
      - run: vpr quality
      - name: Review new code issues against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: vp exec fallow audit --base "$BASE_SHA" --gate new-only --brief
      - name: Retain coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  compatibility:
    name: ${{ matrix.platform }} compatibility
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vpr build

  dependencies:
    name: Dependencies
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    uses: ./.github/workflows/dependency-maintenance.yml

  e2e:
    name: e2e (${{ matrix.browser }})
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          - browser: webkit
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - name: Use Ubuntu archive for browser dependencies
        if: runner.os == 'Linux'
        run: sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - run: vp exec playwright install --with-deps ${{ matrix.browser }}
      - name: Enable WebKit keyboard navigation through all controls
        if: runner.os == 'macOS'
        run: defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
      - run: vp exec playwright test --project=${{ matrix.browser }}
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/e2e-run/
          retention-days: 14
          if-no-files-found: ignore

  container:
    name: Container
    needs: [prepare, checks, compatibility, dependencies, e2e]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.checks.result == 'success' && needs.compatibility.result == 'success' &&
      needs.dependencies.result == 'success' && needs.e2e.result == 'success' ||
      needs.prepare.outputs.reuse == 'true' && needs.checks.result == 'skipped' &&
      needs.compatibility.result == 'skipped' && needs.dependencies.result == 'skipped' &&
      needs.e2e.result == 'skipped')
    uses: ./.github/workflows/docker-build.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      audit: ${{ github.event_name != 'pull_request' || needs.prepare.outputs.audit != 'false' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  verified:
    name: Verification
    if: always()
    needs: [prepare, checks, compatibility, dependencies, e2e, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node --input-type=module -e 'import { verificationPassed } from "./tooling/ci-verification.mjs"; if (!verificationPassed(JSON.parse(process.env.RESULTS))) process.exit(1)'
      - name: Record the tested PR merge tree
        if: github.event_name == 'pull_request'
        env:
          TREE: ${{ needs.prepare.outputs.tree }}
        run: printf '%s\n' "$TREE" > verification-tree.txt
      - name: Retain successful PR verification evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: verified-pr-${{ github.event.pull_request.number }}-${{ needs.prepare.outputs.tree }}
          path: verification-tree.txt
          retention-days: 14
          if-no-files-found: error
