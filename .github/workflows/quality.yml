name: Quality

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - name: Fallow dead-code and dependency gate
        run: pnpm run fallow:dead
      - name: Fallow duplication gate
        run: pnpm run fallow:duplicates
      - name: Fallow health-score gate
        run: pnpm run fallow:health
      - name: Fallow coverage-gap report
        run: pnpm run fallow:coverage-gaps
      - name: Fallow branch review brief
        run: pnpm run fallow:audit
      - name: Render Fallow SARIF
        if: always()
        continue-on-error: true
        run: pnpm run fallow:dead --format sarif --quiet > fallow.sarif
      - run: pnpm run build
      - name: Publish coverage and quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          retention-days: 14
          path: |
            coverage/
            fallow.sarif
          if-no-files-found: warn

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, component, integration, ui]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:${{ matrix.suite }}

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check:roadmap
      - name: Capture device and theme review gallery
        run: pnpm run screenshots:pr
      - name: Publish review gallery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshots
          path: test-results/pr-screenshots/
          retention-days: 14
          if-no-files-found: error
      - name: Run real video benchmark smoke test
        run: pnpm run benchmark:video -- --samples 1 --duration 8 --output "$RUNNER_TEMP/video-latency.md"
      - name: Remove benchmark output
        if: always()
        run: rm -f "$RUNNER_TEMP/video-latency.md"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Publish browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
