name: Quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vp exec vp toolchain
      - run: vpr quality
      - name: Review new code issues against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: vp exec fallow audit --base "$BASE_SHA" --gate new-only --brief
      - name: Retain coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  windows:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vp exec vp toolchain
      - run: vpr lint:css
      - run: vpr typecheck
      - run: vpr build

  dependencies:
    name: Dependencies
    uses: ./.github/workflows/dependency-maintenance.yml

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          # macOS exercises Safari's platform media support with WebKit.
          - browser: webkit
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - name: Use Ubuntu archive for browser dependencies
        if: runner.os == 'Linux'
        run: sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - run: vp exec playwright install --with-deps ${{ matrix.browser }}
      - name: Enable WebKit keyboard navigation through all controls
        if: runner.os == 'macOS'
        run: defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
      - run: vp exec playwright test --project=${{ matrix.browser }}
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/e2e-run/
          retention-days: 14
          if-no-files-found: ignore

  container:
    name: Container
    needs: [checks, windows, dependencies, e2e]
    uses: ./.github/workflows/docker-build.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  verified:
    name: Verification
    if: always()
    needs: [checks, windows, dependencies, e2e, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.RESULTS)).some(job => job.result !== "success")) process.exit(1)'
