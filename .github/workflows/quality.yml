name: Quality

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-install:
    name: Clean toolchain install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vpr lint:css
      - run: vp exec vp toolchain
      - run: vpr typecheck
      - run: vpr build

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vpr lint:css
      - run: vpr test:coverage
      - name: Fallow dead-code and dependency gate
        run: vpr fallow:dead
      - name: Fallow duplication gate
        run: vpr fallow:duplicates
      - name: Fallow health-score gate
        run: vpr fallow:health
      - name: Fallow coverage-gap report
        run: vpr fallow:coverage-gaps
      - name: Fallow branch review brief
        run: vpr fallow:audit
      - name: Render Fallow SARIF
        if: always()
        continue-on-error: true
        # Task banners would corrupt the machine-readable stdout.
        run: vp exec fallow dead-code --format sarif --quiet > fallow.sarif
      - run: vpr build
      - name: Publish coverage and quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          retention-days: 14
          path: |
            coverage/
            fallow.sarif
          if-no-files-found: warn

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, component, integration, ui]
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vpr test:${{ matrix.suite }}

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
      - run: vpr check:roadmap
      - name: Capture device and theme review gallery
        run: vpr screenshots:pr
      - name: Publish review gallery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshots
          path: test-results/pr-screenshots/
          retention-days: 14
          if-no-files-found: error
  media-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
      # Keep measured workloads sequential on a runner without gallery encoders.
      - name: Run real video benchmark smoke test
        run: vpr benchmark:video --samples 1 --duration 8 --output "$RUNNER_TEMP/video-latency.md"
      - name: Verify available HLS encoders and CPU fallback without requiring a GPU
        run: vpr benchmark:encoding --output "$RUNNER_TEMP/video-encoding.json"
      - name: Publish encoder benchmark and fallback evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-encoding-benchmark
          path: ${{ runner.temp }}/video-encoding.json
          retention-days: 14
          if-no-files-found: error
      - name: Remove benchmark output
        if: always()
        run: rm -f "$RUNNER_TEMP/video-latency.md"
      - name: Verify storyboard latency and sustained dragging under media load
        run: vpr benchmark:storyboard --output "$RUNNER_TEMP/storyboard-performance.json"
      - name: Verify cold and prepared long-video seeking without competing browser tests
        run: vpr benchmark:seek
      - name: Publish long-video seek benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: priority-seek-benchmark
          retention-days: 14
          path: |
            test-results/priority-seek-metrics.json
            test-results/priority-seek-run/
            playwright-report/
          if-no-files-found: warn

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          # macOS exercises Safari's platform media support with WebKit.
          - browser: webkit
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
          node-version-file: .node-version
      - run: vp install --frozen-lockfile
      - name: Use Ubuntu archive for browser dependencies
        if: runner.os == 'Linux'
        # The Azure mirror has repeatedly exhausted the browser job's install budget.
        run: sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - run: vp exec playwright install --with-deps ${{ matrix.browser }}
      - name: Enable WebKit keyboard navigation through all controls
        if: runner.os == 'macOS'
        # Safari follows this OS preference; keep the full Tab/focus assertions.
        # https://github.com/microsoft/playwright/issues/41808
        run: defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
      - run: vp exec playwright test --project=${{ matrix.browser }}

      - name: Publish browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
