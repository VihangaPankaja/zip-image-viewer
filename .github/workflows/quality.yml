name: Quality

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - name: Fallow dead-code and dependency gate
        run: pnpm run fallow:dead
      - name: Fallow duplication gate
        run: pnpm run fallow:duplicates
      - name: Fallow health-score gate
        run: pnpm run fallow:health
      - name: Fallow coverage-gap report
        run: pnpm run fallow:coverage-gaps
      - name: Fallow branch review brief
        run: pnpm run fallow:audit
      - name: Render Fallow SARIF
        if: always()
        continue-on-error: true
        run: pnpm run fallow:dead --format sarif --quiet > fallow.sarif
      - run: pnpm run build
      - name: Publish coverage and quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            coverage/
            fallow.sarif
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        browser: ${{ (github.event_name == 'pull_request' && fromJSON('["chromium"]')) || fromJSON('["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test --project=${{ matrix.browser }}
